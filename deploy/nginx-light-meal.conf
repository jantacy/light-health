# 轻食记：nginx stream 按 SNI 把 meal.example.com 分到 real_web(9000)，这里再反代到 Next.js。
# 证书路径由 deploy/setup-server.sh 按主机替换（server1 用通配符证书，server2 用单独签发的 meal 证书）。
server {
    listen 9000 ssl proxy_protocol;
    listen [::]:9000 ssl proxy_protocol;
    http2 on;
    server_name meal.example.com;
    ssl_certificate     __CERT__;
    ssl_certificate_key __KEY__;

    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
